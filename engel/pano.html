<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frau Engel · Raumtest 360°</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  button{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(30,30,30,.75);color:#fff}
  button.on{background:#2b6cb0}
  #info{position:fixed;top:10px;left:12px;right:12px;font-size:13px;opacity:.85;text-shadow:0 1px 2px #000}
  #VRButton{bottom:auto !important;top:44px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="info">Raumtest Frau Engel 360° · Bilder KI-generiert (ChatGPT), Tiefe KI-geschätzt · Wischen = umsehen</div>
<div id="ui">
  <button data-m="-1,0,0">◀ links</button>
  <button data-m="1,0,0">rechts ▶</button>
  <button data-m="0,0,-1">▲ vor</button>
  <button data-m="0,0,1">▼ zurück</button>
  <button id="duck">Bücken</button>
  <button id="sway">Bewegung zeigen</button>
  <span style="width:100%"></span>
  <button data-r="auto360.jpg">Auto</button>
  <button data-r="treppenhaus360.jpg">Treppenhaus</button>
  <button data-r="flur360.jpg">Flur</button>
  <button data-r="wohnzimmer360.jpg">Wohnzimmer</button>
  <button data-r="bad360.jpg">Bad</button>
</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const EYE = 1.6, NEAR = 0.9, FAR = 4.5;
const IMG = new URLSearchParams(location.search).get('bild') || 'wohnzimmer360.jpg', DEP = IMG.replace(/\.\w+$/, '_tiefe.png');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0b);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 50);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
camera.position.set(0, EYE, 0);

const info = document.getElementById('info'), infoText = info.textContent;
const load = src => new Promise((r, f) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => r(i); i.onerror = f; i.src = src; });
const photo = await load(IMG);

// Tiefe: gespeicherte Karte nehmen, sonst einmalig im Browser schätzen (Modell wird danach zwischengespeichert)
const dc = document.createElement('canvas'), dx = dc.getContext('2d');
try {
  const depth = await load(DEP);
  dc.width = depth.width; dc.height = depth.height; dx.drawImage(depth, 0, 0);
} catch {
  info.textContent = 'Raum wird vorbereitet: KI schätzt die Tiefe (beim ersten Mal 20–60 Sekunden) …';
  const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
  const est = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', { dtype: 'fp32',
    progress_callback: p => { if (p.status === 'progress' && p.file?.endsWith('.onnx')) info.textContent = 'Raum wird vorbereitet: Modell laden ' + Math.round(p.progress) + ' % …'; } });
  info.textContent = 'Raum wird vorbereitet: Tiefe berechnen …';
  const d = (await est(new URL(IMG, location.href).href)).depth;
  dc.width = d.width; dc.height = d.height;
  const im = dx.createImageData(d.width, d.height);
  for (let i = 0; i < d.width * d.height; i++) { const v = d.data[i * d.channels]; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  dx.putImageData(im, 0, 0);
}
info.textContent = infoText;
const dd = dx.getImageData(0, 0, dc.width, dc.height).data;
const sample = (u, v) => {
  const x = Math.min(dc.width - 1, Math.max(0, u * (dc.width - 1)));
  const y = Math.min(dc.height - 1, Math.max(0, v * (dc.height - 1)));
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(dc.width - 1, x0 + 1), y1 = Math.min(dc.height - 1, y0 + 1);
  const fx = x - x0, fy = y - y0, g = (xx, yy) => dd[(yy * dc.width + xx) * 4] / 255;
  return (g(x0, y0) * (1 - fx) + g(x1, y0) * fx) * (1 - fy) + (g(x0, y1) * (1 - fx) + g(x1, y1) * fx) * fy;
};

// Kugel aufbauen: jeder Punkt liegt auf seinem Sehstrahl in der geschätzten Entfernung
const SX = 512, SY = 256;
const pos = new Float32Array((SX + 1) * (SY + 1) * 3), uv = new Float32Array((SX + 1) * (SY + 1) * 2), dist = new Float32Array((SX + 1) * (SY + 1));
for (let j = 0, k = 0; j <= SY; j++) for (let i = 0; i <= SX; i++, k++) {
  const u = i / SX, v = j / SY, g = sample(u % 1, v);
  const d = 1 / (g * (1 / NEAR - 1 / FAR) + 1 / FAR);
  const lon = (u - 0.5) * 2 * Math.PI, lat = (0.5 - v) * Math.PI;
  dist[k] = d;
  pos[k * 3] = Math.sin(lon) * Math.cos(lat) * d; pos[k * 3 + 1] = Math.sin(lat) * d + EYE; pos[k * 3 + 2] = -Math.cos(lon) * Math.cos(lat) * d;
  uv[k * 2] = u; uv[k * 2 + 1] = 1 - v;
}
const idx = [];
for (let j = 0; j < SY; j++) for (let i = 0; i < SX; i++) {
  const a = j * (SX + 1) + i, b = a + 1, c = a + SX + 1, e = c + 1;
  const m = Math.min(dist[a], dist[b], dist[c], dist[e]), M = Math.max(dist[a], dist[b], dist[c], dist[e]);
  if (M / m > 1.35) continue;
  idx.push(a, b, c, b, e, c);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
geo.setIndex(idx);
const tex = new THREE.Texture(photo); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })));
// Hintergrund hinter Lücken: dieselbe Kugel weit weg, leicht abgedunkelt
const back = new THREE.Mesh(new THREE.SphereGeometry(FAR * 1.1, 64, 32), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide }));
back.scale.x = -1; back.rotation.y = -Math.PI / 2; back.position.y = EYE; scene.add(back);

// Frau Engel als Video im Sessel (nur Wohnzimmer)
const q = new URLSearchParams(location.search);
let engelVideo = null;
if (IMG.startsWith('wohnzimmer') && q.get('engel') !== '0') {
  const P = (u, v) => { const g = sample(u, v), d = 1 / (g * (1 / NEAR - 1 / FAR) + 1 / FAR), lon = (u - 0.5) * 2 * Math.PI, lat = (0.5 - v) * Math.PI;
    return new THREE.Vector3(Math.sin(lon) * Math.cos(lat) * d, Math.sin(lat) * d + EYE, -Math.cos(lon) * Math.cos(lat) * d); };
  const cu = +(q.get('cu') || 0.381), top = P(cu, +(q.get('vt') || 0.54)), foot = P(cu, +(q.get('vb') || 0.81));
  const v = document.createElement('video');
  v.src = 'figur/engel_sessel_loop.mp4'; v.loop = true; v.muted = true; v.playsInline = true; v.crossOrigin = 'anonymous';
  engelVideo = v;
  const vt = new THREE.VideoTexture(v); vt.colorSpace = THREE.SRGBColorSpace;
  // Ausschnitt im 16:9-Video: Person und Sessel
  const U0 = +(q.get('u0') || 0.34), U1 = +(q.get('u1') || 0.60), V0 = +(q.get('v0') || 0.28), V1 = +(q.get('v1') || 0.97);
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: { map: { value: vt }, r: { value: new THREE.Vector4(U0, U1, V0, V1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D map; uniform vec4 r; varying vec2 vUv;
      void main(){ vec2 t = vec2(mix(r.x, r.y, vUv.x), mix(1.0 - r.w, 1.0 - r.z, vUv.y));
        vec4 c = texture2D(map, t);
        vec2 p = (vUv - vec2(0.5, 0.5)) * 2.0; float e = length(vec2(p.x, p.y * 0.9));
        float a = 1.0 - smoothstep(0.78, 1.0, e); a *= smoothstep(0.0, 0.06, vUv.y);
        gl_FragColor = vec4(c.rgb, a);
#include <colorspace_fragment>
      }` });
  const h = (top.y - foot.y) * +(q.get('hs') || 1.35), w = h * ((U1 - U0) * 1920) / ((V1 - V0) * 1080);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const base = foot.clone().multiplyScalar(+(q.get('dz') || 0.92));
  plane.position.set(base.x, foot.y + h / 2 - 0.05, base.z);
  plane.lookAt(0, plane.position.y, 0);
  plane.renderOrder = 2; scene.add(plane);
  const start = () => v.play().catch(() => {});
  v.addEventListener('canplay', start); addEventListener('pointerdown', start); renderer.xr.addEventListener('sessionstart', start);
}

// Umsehen per Wischen, Kopf bewegen per Tasten
let yaw = 0, pitch = 0, drag = null, off = new THREE.Vector3(), duck = false, sway = false;
addEventListener('pointerdown', e => { if (e.target.tagName !== 'BUTTON') drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  yaw += (e.clientX - drag[0]) * 0.004; pitch += (e.clientY - drag[1]) * 0.004;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  drag = [e.clientX, e.clientY];
});
const step = (x, z) => { off.x = Math.max(-0.5, Math.min(0.5, off.x + x * 0.1)); off.z = Math.max(-0.6, Math.min(0.4, off.z + z * 0.1)); };
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const [x, , z] = b.dataset.m.split(',').map(Number); step(x, z); });
addEventListener('keydown', e => ({ ArrowLeft: () => step(-1, 0), ArrowRight: () => step(1, 0), ArrowUp: () => step(0, -1), ArrowDown: () => step(0, 1) }[e.key]?.()));
document.getElementById('duck').onclick = e => { duck = !duck; e.target.classList.toggle('on', duck); };
document.querySelectorAll('[data-r]').forEach(b => { b.classList.toggle('on', b.dataset.r === IMG); b.onclick = () => location.search = '?bild=' + b.dataset.r; });
document.getElementById('sway').onclick = e => { sway = !sway; e.target.classList.toggle('on', sway); };

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const t0 = performance.now(), cur = new THREE.Vector3(0, EYE, 0);
renderer.setAnimationLoop(() => {
  if (renderer.xr.isPresenting) { rig.position.set(0, 0, 0); return renderer.render(scene, camera); }
  const t = (performance.now() - t0) / 1000;
  const target = new THREE.Vector3(off.x + (sway ? Math.sin(t * 0.7) * 0.35 : 0), (duck ? 1.05 : EYE), off.z + (sway ? Math.sin(t * 0.45) * 0.2 : 0));
  cur.lerp(target, 0.08);
  camera.position.copy(cur);
  camera.rotation.set(-pitch, -yaw, 0, 'YXZ');
  renderer.render(scene, camera);
});
</script>
</body>
</html>
