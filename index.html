<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMPlanck Game Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#101c29;color:#fff;font:17px system-ui}main{max-width:780px;margin:auto;padding:20px}h1{color:#ff9a42;margin:0}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}button{display:block;width:100%;padding:15px;margin:9px 0;background:#234763;color:white;border:1px solid #52738c;border-radius:10px;font:inherit;text-align:left}button:disabled{opacity:.45}small{color:#b9c7d3}label{display:block;margin:12px 0}input{max-width:100%}#status{min-height:45px}details{margin-top:24px}p{line-height:1.5}</style></head><body><main><h1>SIMPlanck</h1><small>GAME LAB · Mission 01 · Technischer Prototyp</small><h2>Hausbesuch bei Frau Weber</h2><video id="v" playsinline controls preload="metadata" hidden></video><p id="status" aria-live="polite">Starten Sie die Mission und entscheiden Sie selbst, wie Sie vorgehen.</p><div id="actions"></div><div id="log"></div><details><summary>Testvideos lokal auswählen (optional)</summary><p>Die Videos bleiben auf Ihrem Gerät. Wählen Sie hier die drei MP4-Dateien aus.</p><label>1. Schwindel <input type="file" accept="video/*" data-clip="0"></label><label>2. Trinkmenge <input type="file" accept="video/*" data-clip="1"></label><label>3. Mobilisation <input type="file" accept="video/*" data-clip="2"></label></details></main><script>const clips=[null,null,null];let history=[],used=new Set(),critical=false;const v=document.querySelector('#v'),s=document.querySelector('#status'),a=document.querySelector('#actions'),l=document.querySelector('#log');document.querySelectorAll('input[data-clip]').forEach(input=>input.onchange=()=>{if(input.files[0]){const i=Number(input.dataset.clip);if(clips[i])URL.revokeObjectURL(clips[i]);clips[i]=URL.createObjectURL(input.files[0])}});function play(i){if(!clips[i]){v.pause();v.hidden=true;return}v.hidden=false;v.src=clips[i];v.play().catch(()=>{});}v.addEventListener('error',()=>{v.hidden=true;});const options=[['ask','Nach der Trinkmenge fragen','Frau Weber berichtet, dass sie heute noch nichts getrunken hat.',1],['sit','Frau Weber bitten, sitzen zu bleiben','Frau Weber bleibt sitzen.',null],['move','Mobilisation beginnen','Beim Mobilisationsversuch zeigt Frau Weber erneut Beschwerden.',2],['bp','Vitalzeichen erheben','Simulierter Befund: Blutdruck 95/60 mmHg, Puls 102/min.',null],['call','Pflegefachkraft kontaktieren','Sie schildern die Beschwerden und veranlassen eine weitere Einschätzung.',null]];function button(label,fn,disabled=false){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;a.append(b)}function draw(){a.replaceChildren();for(let [id,label,msg,clip] of options)button(label,()=>{used.add(id);history.push(label);if(id==='move')critical=true;s.textContent=msg;if(clip!==null)play(clip);else {v.pause();v.hidden=true}draw()},used.has(id));button('Hausbesuch beenden',()=>{a.replaceChildren();v.pause();v.hidden=true;s.textContent=critical?'Reflexion: Beschwerden während der Mobilisation. Wie hätten Sie die Situation sicherer einschätzen können?':used.has('sit')&&used.has('bp')&&used.has('call')?'Reflexion: Sie haben Sicherheit, Einschätzung und Weitergabe berücksichtigt. Welche Ursachen kommen infrage?':'Reflexion: Welche weiteren Schritte zur Einschätzung und Sicherheit fehlen?';l.textContent='Handlungsprotokoll: '+history.join(' → ');button('Erneut spielen',start)});}function start(){history=[];used.clear();critical=false;l.textContent='';s.textContent='Frau Weber berichtet über Schwindel und möchte in die Küche.';play(0);draw()}button('Mission starten',start);</script></body></html>
