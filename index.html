<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SIMPlanck Game Lab 0.3</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#142334;color:#fff;font:16px system-ui}#world{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none;z-index:5}header{background:#122337e8;padding:12px 16px}b{color:#ff9c43}#message{margin:10px;background:#122337e8;padding:12px;border-radius:10px;max-width:570px}button,label,details{pointer-events:auto}button{border:1px solid #7190a6;background:#183c57ef;color:white;border-radius:12px;padding:13px;font:inherit;touch-action:none}#controls{position:absolute;bottom:24px;left:15px;display:grid;grid-template-columns:repeat(3,52px);gap:5px}#controls button{font-size:22px;padding:10px}#use{position:absolute;right:16px;bottom:32px;background:#b65d17;max-width:46%}#menu{position:absolute;top:10px;right:10px}#panel{position:absolute;top:65px;right:10px;max-height:75vh;overflow:auto;width:min(340px,94vw);background:#172c40;padding:16px;border-radius:12px;pointer-events:auto}#panel[hidden],#film[hidden]{display:none}input{max-width:100%;margin:7px 0}#film{position:absolute;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto}video{width:min(94vw,850px);max-height:72vh}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;text-shadow:0 1px 4px black}#finish{margin:8px 0}small{color:#b9cbd8}</style></head><body><div id="world"><a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true;colorManagement:true" background="color:#b8ccd4"><a-entity light="type:ambient;intensity:0.85"></a-entity><a-entity light="type:directional;intensity:0.8" position="-3 6 2"></a-entity><a-entity id="rig" position="0 0 3"><a-entity id="cam" camera position="0 1.6 0" look- const room=document.querySelector('#room'),rig=document.querySelector('#rig'),cam=document.querySelector('#cam'),ray=document.querySelector('#ray'),msg=document.querySelector('#message'),use=document.querySelector('#use'),panel=document.querySelector('#panel'),film=document.querySelector('#film'),video=document.querySelector('#video');
let history=[],done=new Set(),clips=[null,null,null],target=null,move=null,elapsed=0,unsafe=false,finished=false;
function entity(tag,attrs,parent=room){let e=document.createElement(tag);for(let k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function box(x,y,z,w,h,d,c,parent=room){return entity('a-box',{position:[x,y,z].join(' '),width:w,height:h,depth:d,color:c},parent)}
function sphere(x,y,z,r,c,parent=room){return entity('a-sphere',{position:[x,y,z].join(' '),radius:r,color:c},parent)}

function spot(id,title,x,y,z,w,h,d){let e=box(x,y,z,w,h,d,'#ec933b');e.setAttribute('material','opacity:0.13;transparent:true');e.classList.add('usable');e.dataset.id=id;e.dataset.title=title;label(title,x,y+h/2+.18,z+.03);return e}

let person=entity('a-entity',{position:'-1.7 0 -2.85'});box(0,1.04,0,.52,.65,.34,'#b9aa94',person);sphere(0,1.53,0,.22,'#d6aa8c',person);sphere(0,1.63,-.05,.23,'#b2b2ad',person);box(-.16,.62,.3,.23,.28,.65,'#716f63',person);box(.16,.62,.3,.23,.28,.65,'#716f63',person);box(-.16,.33,.58,.22,.62,.22,'#716f63',person);box(.16,.33,.58,.22,.62,.22,'#716f63',person);box(-.35,1,.1,.15,.5,.18,'#b9aa94',person);box(.35,1,.1,.15,.5,.18,'#b9aa94',person);

let rug=box(-1.6,.025,-.3,2.3,.05,1.8,'#9a5144');box(-.5,.08,-.3,.15,.12,1.8,'#b76a50');let rugSpot=spot('rug','Teppich',-1.6,.12,-.3,2.3,.18,1.8);

// kitchen corner and telephone
box(3.6,.48,1.8,2.1,.96,1,'#c6c0ae');box(3.6,1,1.8,2.2,.1,1.05,'#626f73');box(3.7,1.09,1.6,.18,.08,.3,'#26353f');spot('call','Telefon',3.7,1.15,1.6,.5,.35,.45);

box(-3.8,.5,1,1.5,.65,2.7,'#8d7462');box(-4.45,1.05,1,.25,1.1,2.7,'#8d7462');box(-3.8,.8,-.25,1.5,.5,.25,'#8d7462');box(-3.8,.8,2.25,1.5,.5,.25,'#8d7462');box(2.5,1.95,-4.86,1.4,.85,.08,'#8b6848');box(2.5,1.95,-4.8,1.25,.7,.05,'#8faf84');
function say(t){msg.textContent=t}
function play(i){if(!clips[i])return;film.hidden=false;move=null;video.src=clips[i];video.play().catch(()=>{})}
document.querySelector('#skip').onclick=()=>{video.pause();film.hidden=true};video.onended=()=>{film.hidden=true};document.querySelector('#menu').onclick=()=>{panel.hidden=!panel.hidden;move=null};document.querySelector('#close').onclick=()=>panel.hidden=true;
['Schwindel','Trinkmenge','Mobilisation'].forEach((name,i)=>{let l=document.createElement('label');l.textContent=name;let input=document.createElement('input');input.type='file';input.accept='video/*';input.onchange=()=>{if(input.files[0]){if(clips[i])URL.revokeObjectURL(clips[i]);clips[i]=URL.createObjectURL(input.files[0]);l.style.color='#9fdb9e'}};l.append(document.createElement('br'),input);document.querySelector('#inputs').append(l,document.createElement('br'))});
document.querySelector('#intro').onclick=()=>{panel.hidden=true;say('Frau Weber: Mir ist heute so schwindelig.');play(0)};
const reactions={talk:['Nach Trinkmenge gefragt','Frau Weber: Heute habe ich noch gar nichts getrunken.',1],sit:['Sicherheit besprochen','Frau Weber bleibt zunächst im Sessel sitzen.'],water:['Trinken angeboten','Frau Weber ist wach und gibt an, sicher schlucken zu können. Sie nimmt einige Schlucke.'],bp:['Vitalzeichen erhoben','Simulierter Befund: RR 95/60 mmHg, Puls 102/min.'],rug:['Stolperstelle beseitigt','Der Laufweg ist frei.'],move:['Mobilisation versucht','Frau Weber richtet sich auf und berichtet über zunehmenden Schwindel. Die Mobilisation wird unterbrochen.',2],call:['Pflegefachkraft kontaktiert','Sie geben die Beobachtungen weiter. Eine weitere Abklärung wird organisiert.']};
function act(id){if(finished||done.has(id))return;const r=reactions[id];if(!r)return;done.add(id);history.push(r[0]);if(id==='move')unsafe=true;if(id==='rug'){rug.setAttribute('visible',false);rugSpot.classList.remove('usable');rugSpot.setAttribute('visible',false);ray.components.raycaster.refreshObjects()}say(r[1]);if(r[2]!==undefined)play(r[2]);}
use.onclick=()=>{if(target)act(target.dataset.id)};
function tick(){requestAnimationFrame(tick);if(!rig.object3D||!cam.object3D)return;const rc=ray.components.raycaster;target=rc&&rc.intersectedEls.find(e=>!done.has(e.dataset.id));use.disabled=!target||finished;use.textContent=target?target.dataset.title+' benutzen':'Gegenstand ansehen';if(move&&!finished&&film.hidden&&panel.hidden){let angle=cam.object3D.rotation.y;let dx=0,dz=0;let speed=.045;if(move==='f')dz=-speed;if(move==='b')dz=speed;if(move==='l')dx=-speed;if(move==='r')dx=speed;let p=rig.object3D.position;p.x=Math.max(-4.5,Math.min(4.5,p.x+dx*Math.cos(angle)+dz*Math.sin(angle)));p.z=Math.max(-4.5,Math.min(4.5,p.z-dx*Math.sin(angle)+dz*Math.cos(angle)));}}
document.querySelectorAll('[data-m]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);move=b.dataset.m};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>move=null});
window.addEventListener('keydown',e=>{const m={w:'f',a:'l',s:'b',d:'r',ArrowUp:'f',ArrowDown:'b',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m)move=m;if(e.key==='e'&&target)act(target.dataset.id)});window.addEventListener('keyup',()=>move=null);
document.querySelector('#finish').onclick=()=>{finished=true;move=null;document.querySelector('#report').textContent=(unsafe?'Reflexion: Beschwerden bei der Mobilisation. ':done.has('sit')&&done.has('bp')&&done.has('call')?'Reflexion: Sicherheit, Einschätzung und Weitergabe berücksichtigt. ':'Reflexion: Welche Maßnahmen fehlen? ')+' Handlungsprotokoll: '+(history.join(' → ')||'Keine Maßnahmen')};tick();
